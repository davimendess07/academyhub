<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Empréstimos - AcademyHub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/emprestimos-admin.css">
</head>

<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <div class="logo-icon">
                    <img src="../images/logo.png.png" style="width:95px; height:95px;">
                </div>
                AcademyHub
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-avatar">A</div>
                    <span>Administrador</span>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Sair
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Gerenciar Empréstimos</h1>
            <div class="header-actions">
                <button class="btn-action" onclick="openNewLoanModal()" style="font-size:1rem; padding: 0.8rem 1.2rem; min-width: 160px;">
                    <i class="fas fa-plus"></i>
                    Novo Empréstimo
                </button>
                <div class="total-badge" title="Total de Empréstimos">
                    <div class="total-label" style="font-size:0.85rem; color: var(--text-gray);">Total</div>
                    <div id="totalLoansHeader" class="total-number">0</div>
                </div>
                <a href="dashboard.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar</a>
            </div>
        </div>

        <div class="stats-cards">
            <div class="stat-card active">
                <div class="stat-number" id="activeCount">0</div>
                <div class="stat-label">Empréstimos Ativos</div>
            </div>
            <div class="stat-card overdue">
                <div class="stat-number" id="overdueCount">0</div>
                <div class="stat-label">Em Atraso</div>
            </div>
            <div class="stat-card total">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Histórico</div>
            </div>
        </div>

        <div class="loans-container">
            <h3 class="section-title">Lista de Empréstimos</h3>

            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterLoans('todos')">Todos</button>
                <button class="tab-btn" onclick="filterLoans('ativo')">Ativos</button>
                <button class="tab-btn" onclick="filterLoans('atraso')">Em Atraso</button>
                <button class="tab-btn" onclick="filterLoans('devolvido')">Devolvidos</button>
                <button class="tab-btn" onclick="filterLoans('cancelado')">Cancelados</button>
            </div>

            <div class="loans-list" id="loansList">
                <div class="empty-state">Carregando empréstimos...</div>
            </div>
        </div>
    </main>

    <!-- Modal Novo Empréstimo -->
    <div id="newLoanModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Novo Empréstimo</h3>
                <button class="btn-close" onclick="closeModal('newLoanModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="newLoanForm">
                <div class="form-group">
                    <label>Email do Aluno *</label>
                    <input type="email" class="form-control" id="studentEmail" required>
                </div>
                <div class="form-group">
                    <label>Livro *</label>
                    <select class="form-control" id="bookSelect" required>
                        <option value="">Selecione um livro...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data de Devolução *</label>
                    <input type="date" class="form-control" id="dueDate" required>
                </div>
                <button type="submit" class="btn-submit">Registrar Empréstimo</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/emprestimos-admin.js"></script>
</body>

</html>
