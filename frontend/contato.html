<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - AcademyHub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --teal: #4a9b9b;
            --blue: #2980b9;
            --green: #7cb342;
            --orange: #ff9800;
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --dark-gray: #2c3e50;
            --text-gray: #5a6c7d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--dark-gray);
            background: var(--white);
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--white) 0%, var(--light-gray) 100%);
            padding: 1rem 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--blue);
        }

        .header-nav {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .header-nav a {
            text-decoration: none;
            color: var(--text-gray);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .header-nav a:hover,
        .header-nav a.active {
            color: var(--blue);
        }

        /* Main Content */
        main {
            padding-top: 100px;
        }

        .section-header {
            text-align: center;
            padding: 4rem 20px 2rem;
            background: linear-gradient(135deg, #e3f2fd 0%, #f1f8e9 50%, #fff3e0 100%);
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--dark-gray);
            margin-bottom: 1rem;
        }

        .section-subtitle {
            font-size: 1.2rem;
            color: var(--text-gray);
        }

        /* Contact Section */
        .contact-container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 20px;
        }

        /* Contact Form */
        .contact-form {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(41, 128, 185, 0.15);
            border: 1px solid rgba(41, 128, 185, 0.1);
            margin-bottom: 4rem;
        }

        /* Contact Info */
        .contact-info {
            padding: 3rem 0;
            text-align: center;
        }

        .contact-info h3 {
            font-size: 2rem;
            color: var(--dark-gray);
            margin-bottom: 3rem;
        }

        .contact-items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 3rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .contact-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            transition: all 0.3s ease;
        }

        .contact-item:nth-child(1) .contact-icon {
            background: linear-gradient(135deg, var(--green), #a8d982);
            box-shadow: 0 8px 20px rgba(124, 179, 66, 0.3);
        }

        .contact-item:nth-child(2) .contact-icon {
            background: linear-gradient(135deg, var(--orange), #f2cc07);
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.3);
        }

        .contact-icon:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .contact-details h4 {
            font-size: 1.2rem;
            color: var(--dark-gray);
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .contact-details p {
            color: var(--text-gray);
            font-size: 1rem;
        }

        .contact-form h3 {
            font-size: 1.8rem;
            color: var(--dark-gray);
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--dark-gray);
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--blue);
            background: #e3f2fd;
            box-shadow: 0 0 0 3px rgba(41, 128, 185, 0.1);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .btn-send {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--blue), var(--teal));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            box-shadow: 0 4px 15px rgba(41, 128, 185, 0.3);
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(41, 128, 185, 0.4);
        }

        .btn-send i {
            font-size: 1.2rem;
        }

        /* Footer */
        footer {
            color: #636363;
            padding: 1.5rem 20px;
            margin-top: 4rem;
            background: white;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            border-top: 1px solid #5c5c5c;
            padding-top: 1.5rem;
        }

        .footer-content p {
            margin: 0.5rem 0;
            color: #5c5c5c;
            font-size: 0.95rem;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .contact-items-grid {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }

            .contact-info,
            .contact-form {
                padding: 2rem;
            }
        }

        @media (max-width: 768px) {
            .header-nav {
                display: none;
            }

            .section-title {
                font-size: 2rem;
            }

            .contact-info h3,
            .contact-form h3 {
                font-size: 1.5rem;
            }

            .contact-item {
                padding: 1rem;
            }

            .contact-icon {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
        }

                /* Footer */
        .site-footer {
            color: #636363;
            padding: 1.5rem 2rem;
            margin-top: 4rem;
            background: white;
        }

        .footer-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 2rem;
            border-top: 1px solid #5c5c5c;
            padding-top: 1.5rem;
        }

        .footer-left {
            text-align: left;
        }

        .footer-left p {
            margin: 0;
            font-size: 0.95rem;
            color: #5c5c5c;
        }

        .footer-center {
            display: flex;
            justify-content: center;
        }

        .footer-logo {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .footer-logo:hover {
            transform: scale(1.1);
        }

        .footer-logo img {
            width: 85px;
            height: 85px;
        }

        .footer-right {
            text-align: right;
        }

        .footer-links {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 2rem;
            justify-content: flex-end;
        }

        .footer-links li {
            display: inline-block;
        }

        .footer-links a {
            color: #5c5c5c;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #3498db;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo">
                <img src="images/logo.png.png" alt="Logo" style="width:95px; height:95px;">
                AcademyHub
            </div>
            <ul class="header-nav">
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </div>
    </header>

    <main>
        <!-- Header Section -->
        <div class="section-header">
            <h2 class="section-title">Entre em Contato</h2>
            <p class="section-subtitle">Tem dúvidas ou sugestões? Estamos aqui para ajudar!</p>
        </div>

        <!-- Contact Container -->
        <div class="contact-container">
            <!-- Contact Form -->
            <div class="contact-form">
                <h3>Envie sua Mensagem</h3>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Nome Completo</label>
                        <input type="text" id="name" name="name" required placeholder="Seu nome completo">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="seu@email.com">
                    </div>

                    <div class="form-group">
                        <label for="subject">Assunto</label>
                        <input type="text" id="subject" name="subject" required placeholder="Assunto da mensagem">
                    </div>

                    <div class="form-group">
                        <label for="message">Mensagem</label>
                        <textarea id="message" name="message" required placeholder="Digite sua mensagem aqui..."></textarea>
                    </div>

                    <button type="submit" class="btn-send">
                        <i class="fas fa-paper-plane"></i>
                        Enviar Mensagem
                    </button>
                </form>
            </div>

            <!-- Contact Info -->
            <div class="contact-info">
                <h3>Informações de Contato</h3>
                
                <div class="contact-items-grid">
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="contact-details">
                            <h4>Email</h4>
                            <p>academmyhub@gmail.com</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-left">
                <p>©2025 AcademyHub - Sistema Bibliotecário Inteligente</p> 
                <p>Desenvolvido como TCC</p>
            </div>
            
            <div class="footer-center">
                <a href="index.html" class="footer-logo">
                    <img src="images/logo-sem-fundo.png" alt="AcademyHub Logo">
                </a>
            </div>
            
            <div class="footer-right">
                <ul class="footer-links">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <script>
        // Form submission handling
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Mensagem enviada com sucesso! Entraremos em contato em breve.');
            this.reset();
        });
    </script>
</body>
</html>
