<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Empréstimos - AcademyHub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/emprestimos-aluno.css">
</head>

<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <div class="logo-icon">
                    <img src="../images/logo.png.png" alt="Logo" style="width:95px; height:95px;">
                </div>
                AcademyHub
            </div>
            <ul class="header-nav">
                <li><a href="../index.html">Início</a></li>
                <li><a href="../sobre.html">Sobre</a></li>
                <li><a href="../contato.html">Contato</a></li>
            </ul>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-avatar">A</div>
                    <span>Aluno</span>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Sair
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="page-header">
            <div class="header-left">
                <h1 class="page-title">Meus Empréstimos</h1>
                <p class="page-subtitle">Gerencie seus livros emprestados e acompanhe prazos</p>
            </div>
            <a href="dashboard.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>

        <!-- Estatísticas -->
        <div class="stats-cards">
            <div class="stat-card active">
                <div class="stat-number" id="activeCount">0</div>
                <div class="stat-label">Empréstimos Ativos</div>
            </div>
            <div class="stat-card overdue">
                <div class="stat-number" id="overdueCount">0</div>
                <div class="stat-label">Em Atraso</div>
            </div>
            <div class="stat-card total">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Histórico</div>
            </div>
        </div>

        <!-- Lista de Empréstimos -->
        <div class="loans-container">
            <h3 class="section-title">Lista de Empréstimos</h3>

            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterLoans('todos')">Todos</button>
                <button class="tab-btn" onclick="filterLoans('ativo')">Ativos</button>
                <button class="tab-btn" onclick="filterLoans('atraso')">Em Atraso</button>
                <button class="tab-btn" onclick="filterLoans('devolvido')">Devolvidos</button>
            </div>

            <div class="loans-list" id="loansList">
                <div class="empty-state">Carregando empréstimos...</div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Nossa configuração -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/emprestimos-aluno.js"></script>
</body>

</html>
